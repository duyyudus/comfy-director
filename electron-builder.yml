appId: com.comfytoolkit.app
productName: Comfy Toolkit
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
nsis:
  artifactName: comfy-toolkit-${version}-setup.${ext}
mac:
  target: dmg
linux:
  target: AppImage
  category: Graphics
