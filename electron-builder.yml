appId: com.comfydirector.app
productName: Comfy Director
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png
extraResources:
  - from: comfyui-node
    to: comfyui-node
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
nsis:
  artifactName: comfy-director-${version}-setup.${ext}
mac:
  target: dmg
linux:
  target: AppImage
  category: Graphics
